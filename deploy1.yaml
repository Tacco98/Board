name: Build and Conditional Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Do you want to deploy?"
        required: true
        default: "no"
      app_name:
        description: "Application name"
        required: true
        default: "demo-app"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Simulate Build
        run: |
          echo "Building application: ${{ github.event.inputs.app_name }}"
          echo "Build completed successfully"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.deploy == 'yes' }}

    steps:
      - name: Deploy Application
        run: |
          echo "Deploying application: ${{ github.event.inputs.app_name }}"
          echo "Deployment successful 🚀"
